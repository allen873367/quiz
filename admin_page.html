  #header a:link, #header a:visited { color: var(--header-link); }
  #user-tools a { color: var(--header-link); }
  #user-tools a:hover { color: white; }
  div.breadcrumbs {
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: var(--body-quiet-color);
  }
  div.breadcrumbs a { color: var(--link-fg); }
  #content h1 { color: var(--body-loud-color); }
  .module { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
  .module h2, .module caption { background: rgba(255,255,255,0.08); color: var(--body-loud-color); }
  .module td, .module th { border-bottom: 1px solid rgba(255,255,255,0.06); }
  thead th { background: rgba(255,255,255,0.06); color: var(--body-loud-color); }
  tr:nth-child(odd), .row1 { background: transparent; }
  tr:nth-child(even), .row2 { background: rgba(255,255,255,0.03); }
  input, textarea, select {
    background: rgba(0,0,0,0.25) !important;
    color: var(--body-loud-color) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    border-radius: 6px !important;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.20) !important;
  }
  .submit-row { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px 20px; }
  .button, input[type=submit], input[type=button], .submit-row input {
    border-radius: 6px !important;
    font-weight: 500 !important;
  }
  .paginator { background: rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.08); }
  .selector-chosen h2 { background: var(--primary) !important; }
  #changelist { background: transparent; }
  #changelist-filter { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
  #changelist-filter li.selected a { color: var(--link-fg); }
  .field-is_new { text-align: center; }
  .field-is_new img { vertical-align: middle; }
</style>
