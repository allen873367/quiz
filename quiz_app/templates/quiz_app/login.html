<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登入 — 資料結構測驗</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'quiz_app/css/style.css' %}"/>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="{% url 'home' %}">
        <span class="brand-icon">DS</span>
        <span>資料結構測驗</span>
      </a>
      <nav class="nav">
        <a class="nav-link" href="{% url 'home' %}">首頁</a>
        <a class="nav-link" href="{% url 'leaderboard' %}">排行</a>
        <a class="nav-link" href="{% url 'quiz_records' %}">紀錄</a>
      </nav>
      <div class="header-meta"></div>
    </div>
  </header>

  <main>
    <div class="container auth-card">
      <div class="panel">
        <div class="panel-header">
          <span>🔑 登入</span>
          <span class="tag tag-indigo">歡迎</span>
        </div>
        <div class="panel-body" style="padding:32px;">
          <div style="text-align:center;margin-bottom:24px;">
            <h1 style="font-size:28px;margin:0;">歡迎回來</h1>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label>&gt; username</label>
              <input class="input" type="text" name="username" placeholder="輸入帳號..." required autofocus>
            </div>
            <div class="form-group">
              <label>&gt; password</label>
              <input class="input" type="password" name="password" placeholder="輸入密碼..." required>
            </div>
            {% if error %}
              <p class="error">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">
              登入 →
            </button>
          </form>

          <div class="auth-links">
            <p>還沒有帳號？<a href="{% url 'register' %}">註冊</a></p>
            <p><a href="{% url 'home' %}">返回首頁</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>
</body>
</html>
