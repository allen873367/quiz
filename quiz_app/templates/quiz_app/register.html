<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>註冊 — 資料結構測驗</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'quiz_app/css/style.css' %}"/>
</head>
<body>
<div class="app">

  <div class="stars">
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
  </div>

  <div class="floating-orb"></div>
  <div class="floating-orb"></div>
  <div class="floating-orb"></div>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="{% url 'home' %}">
        <span class="brand-icon">DS</span>
        <span>資料結構測驗</span>
      </a>
      <nav class="nav" id="main-nav">
        <a class="nav-link" href="{% url 'home' %}">首頁</a>
        <a class="nav-link" href="{% url 'leaderboard' %}">排行</a>
        <a class="nav-link" href="{% url 'quiz_records' %}">紀錄</a>
      </nav>
      <button class="nav-toggle" id="nav-toggle" onclick="toggleNav()" aria-label="選單">☰</button>
      <div class="header-meta"></div>
    </div>
  </header>

  <main>
    <div class="container auth-wrap">
      <div class="panel">
        <div class="panel-header">
          <span>📝 註冊</span>
          <span class="tag tag-cyan">新帳號</span>
        </div>
        <div class="panel-body" style="padding:32px;">
          <div style="text-align:center;margin-bottom:24px;">
            <h1 style="font-size:28px;margin:0;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">建立帳號</h1>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="form-group">
              <label>&gt; username</label>
              <input class="input" type="text" name="username" placeholder="輸入帳號..." required autofocus>
            </div>
            <div class="form-group">
              <label>&gt; nickname</label>
              <input class="input" type="text" name="nickname" placeholder="輸入暱稱..." required>
            </div>
            <div class="form-group">
              <label>&gt; password</label>
              <input class="input" type="password" name="password" placeholder="輸入密碼..." required>
            </div>
            <div class="form-group">
              <label>&gt; confirm password</label>
              <input class="input" type="password" name="confirm_password" placeholder="再次輸入密碼..." required>
            </div>
            {% if error %}
              <p class="error">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">
              註冊 →
            </button>
          </form>

          <div class="auth-links">
            <p>已有帳號？<a href="{% url 'login' %}">登入</a></p>
            <p><a href="{% url 'home' %}">返回首頁</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>

<script>
function toggleNav() {
  var nav = document.getElementById('main-nav');
  var btn = document.getElementById('nav-toggle');
  if (nav) { nav.classList.toggle('open'); btn.classList.toggle('active'); }
}
document.addEventListener('click', function(e) {
  var nav = document.getElementById('main-nav');
  var btn = document.getElementById('nav-toggle');
  if (nav && nav.classList.contains('open') && !nav.contains(e.target) && !btn.contains(e.target)) {
    nav.classList.remove('open'); btn.classList.remove('active');
  }
});
</script>

</body>
</html>
