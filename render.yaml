services:
  - type: web
    name: quiz-app
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn quiz_project.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ${RENDER_EXTERNAL_URL}
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-db
          property: connectionString
databases:
  - name: quiz-db
    databaseName: quiz_db
    user: quiz_user
    plan: free
